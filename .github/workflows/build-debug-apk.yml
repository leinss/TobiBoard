name: Build debug APK (WisprBoard)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    # The self-hosted runner while it is online, GitHub-hosted runners when it
    # is not: CI_RUNS_ON names one or the other, and unset means GitHub-hosted.
    # A pull request from another repository always runs on GitHub-hosted
    # runners.
    runs-on: >-
      ${{ fromJSON(
            (github.event_name == 'pull_request'
             && github.event.pull_request.head.repo.full_name != github.repository)
            && '["ubuntu-latest"]'
            || vars.CI_RUNS_ON
            || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # GitHub-hosted runners ship the Android SDK and the self-hosted runner
      # does not. This installs the command-line tools into the job's home and
      # accepts the licenses; the Android Gradle plugin then installs the
      # platform, build tools and NDK the build pins, on first use.
      - name: Set up Android SDK
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          validate-wrappers: true  # v3 does not check gradle-wrapper.jar by default

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fetch native libs (sherpa-onnx AAR)
        run: make fetch-native-libs

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WisprBoard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
