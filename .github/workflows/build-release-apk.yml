name: Build signed release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The signing key lives in repository secrets. A fork, or this repo before the secrets
  # are added, cannot produce a signed APK, and failing the whole workflow for that made
  # every run red and hid real build breakage. Report it once, as a warning, and skip.
  signing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning title=Signed release build skipped::KEYSTORE_BASE64 is not set. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets to build signed releases (see the README release section)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: signing-secrets
    if: needs.signing-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # only needed for the release-creation step

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Get and validate version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^\s*versionName\s*=\s*"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match versionName ${VERSION} (expected ${EXPECTED_TAG})"
            exit 1
          fi
          echo "name=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run release verification
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Keystore file is empty — check KEYSTORE_BASE64 secret"
            exit 1
          fi
          keytool -list -keystore app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || {
            echo "::error::Keystore validation failed — check KEYSTORE_PASSWORD and KEY_ALIAS secrets"
            exit 1
          }

      - name: Fetch native libs (sherpa-onnx AAR)
        run: make fetch-native-libs

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle-release.log

      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          # apksigner is in the Android SDK build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Verifying: $APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WisprBoard-release
          path: app/build/outputs/apk/release/*.apk

      - name: Generate APK checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Ensure release is immutable
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published artifacts are immutable"
            exit 1
          fi

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: WisprBoard ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true

      - name: Clean up keystore
        if: always()
        run: rm -f app/keystore.jks

      - name: Upload Gradle build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-log
          path: /tmp/gradle-release.log

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: failure()
