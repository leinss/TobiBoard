# F-Droid build recipe for TobiBoard.
#
# This file is NOT consumed by this repository. To request inclusion in the
# F-Droid main repo, submit its contents as a merge request to F-Droid's data repo:
#
#   https://gitlab.com/fdroid/fdroiddata
#   ->  metadata/xyz.leinss.TobiBoard.yml   (F-Droid names metadata by applicationId)
#
# Summary, description, icon, screenshots and per-version changelogs are read
# automatically from the fastlane metadata already in this repo
# (fastlane/metadata/android/en-US/...), so they are intentionally omitted here.
#
# NOT SUBMITTABLE TO F-DROID MAIN AS-IS. F-Droid main forbids prebuilt binaries
# and this build pulls two:
#   1. the sherpa-onnx STT runtime, a prebuilt AAR fetched at build time
#      (`make fetch-native-libs`; app/libs/sherpa-onnx-1.13.2.aar, gitignored);
#   2. MediaPipe `com.google.mediapipe:tasks-genai`, a Maven artifact that
#      bundles prebuilt native .so libraries.
# Acceptance on main would require building sherpa-onnx + onnxruntime + MediaPipe
# from source in the recipe (tracked as M2-2 — XL). Until then the only FOSS
# channel is the self-hosted repo (leinss.xyz/TobiBoard/repo). IzzyOnDroid is
# ruled out on two independent counts: the 121.7 MB APK against its 30 MB per
# file limit, and the same prebuilt blobs. See docs/fdroid/IZZYONDROID_SUBMISSION.md.
# This recipe is kept accurate for that future source-build work.

Categories:
  - System
License: GPL-3.0-or-later
AuthorName: leinss
SourceCode: https://github.com/leinss/TobiBoard
IssueTracker: https://github.com/leinss/TobiBoard/issues
Changelog: https://github.com/leinss/TobiBoard/releases

# Core typing (glide, autocorrect, suggestions, dictionaries) is fully on-device.
# The optional Voice-to-Text and Text Fix features default to an on-device LOCAL
# provider with no key required: Parakeet TDT 0.6B v3 via sherpa-onnx for speech,
# and Qwen2.5 1.5B Instruct via MediaPipe for text fix. A Google Gemma 3 1B INT4
# model is opt-in and needs the user to accept Google's terms plus a Hugging Face
# token. User-chosen cloud providers (OpenRouter / PayPerQ) use the user's own key.
# Both features are off by default; the LOCAL provider never contacts any server.
AntiFeatures:
  NonFreeNet:
    en-US: The optional AI voice-to-text and text-fix features send audio or selected text to a user-chosen cloud provider (OpenRouter or PayPerQ) using the user's own API key. Both features are off by default; all core keyboard functions work fully offline.
  NonFreeDep:
    en-US: The on-device Text Fix feature loads a local LLM via Google's MediaPipe (com.google.mediapipe:tasks-genai), which ships prebuilt proprietary native libraries. The optional on-device voice-to-text uses the sherpa-onnx runtime shipped as a prebuilt AAR. Both are bundled in the APK. This is why the app is not (yet) submittable to F-Droid main or IzzyOnDroid, which reject non-free dependencies (see header).

RepoType: git
Repo: https://github.com/leinss/TobiBoard.git

# F-Droid builds the tagged commit FROM SOURCE with a keyless (unsigned) release
# build, which only succeeds on commits that gate the signing guard behind
# REQUIRE_SIGNED_RELEASE (present since the 6.8.x line). Pinned to the latest
# PUBLISHED release tag (v6.8.16, published 2026-08-31). A real source build additionally needs the
# prebuilt-binary blocker above resolved. Keep CurrentVersion in sync with the
# latest published GitHub release tag (see `gh release view --repo leinss/TobiBoard`),
# NOT with app/build.gradle.kts on main — main is often bumped ahead of a release
# (e.g. 6.8.8/6808 on main while the latest release was 6.8.6/6806).
Builds:
  - versionName: 6.8.16
    versionCode: 6816
    commit: v6.8.16
    ndk: 28.0.13004108
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 6.8.16
CurrentVersionCode: 6816
